<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Återställ lösenord | Elysium Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070a;
      --panel: #0b1420;
      --blue: #0084ff;
      --cyan: #00d1ff;
      --text: #ffffff;
      --muted: #91a0b0;
      --border: rgba(255,255,255,.09);
      --red: #ff6477;
      --green: #3bd98f;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(0,132,255,.16), transparent 32%),
        radial-gradient(circle at 90% 20%, rgba(0,209,255,.08), transparent 28%),
        linear-gradient(180deg, #05070a 0%, #07101a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(11,20,32,.96);
      border: 1px solid rgba(0,209,255,.2);
      border-radius: 26px;
      padding: 36px;
      box-shadow: 0 35px 90px rgba(0,0,0,.5);
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 80%;
      margin: 0 auto 28px;
    }

    .eyebrow {
      text-align: center;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: #07111b;
      color: white;
      padding: 0 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,209,255,.08);
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      color: white;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffd9de;
      background: rgba(255,100,119,.09);
      border: 1px solid rgba(255,100,119,.26);
    }

    .message.success {
      display: block;
      color: #d3ffe9;
      background: rgba(59,217,143,.09);
      border: 1px solid rgba(59,217,143,.25);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back:hover {
      color: var(--cyan);
    }
  
/* ELYSIUM PASSWORD RECOVERY — MOBILE */
@media(max-width:600px){
 html,body{max-width:100%;overflow-x:hidden}
 body{min-height:100dvh;padding:16px}
 .card{width:100%;max-width:100%;padding:29px 20px;border-radius:19px}
 .logo{max-width:70%;height:auto}
 h1{font-size:clamp(24px,7vw,32px);line-height:1.15}
 input{width:100%;max-width:100%;min-height:46px;font-size:16px}
 button{min-height:47px;max-width:100%}
}

</style>
</head>

<body>

  <div class="card">

    <img
      src="elysium-header-logo.png"
      alt="Elysium Gaming Lounge"
      class="logo"
    >

    <div class="eyebrow">
      Personalportal
    </div>

    <h1>
      Återställ lösenord
    </h1>

    <p class="sub">
      Ange ett nytt lösenord för ditt Elysium Admin-konto.
    </p>

    <form id="resetForm">

      <div class="field">
        <label for="password">
          Nytt lösenord
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Minst 8 tecken"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">
          Bekräfta nytt lösenord
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Skriv lösenordet igen"
          required
        >
      </div>

      <button
        id="saveButton"
        class="btn"
        type="submit"
      >
        SPARA NYTT LÖSENORD
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <a
      href="admin.html"
      class="back"
    >
      Tillbaka till Admin
    </a>

  </div>


  <script>
    const SUPABASE_URL =
      "https://jbwebwdockhgivltgjdu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cDN31gaVNoAG5YdSw_vscw_rJhiZTz6";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const resetForm =
      document.getElementById("resetForm");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }


    async function prepareRecoverySession() {

      const hash =
        window.location.hash;

      if (!hash) {
        showMessage(
          "Återställningslänken saknar giltig inloggningsinformation. Begär en ny lösenordsåterställning från Supabase.",
          "error"
        );

        saveButton.disabled = true;
        return;
      }


      const params =
        new URLSearchParams(
          hash.substring(1)
        );


      const accessToken =
        params.get("access_token");

      const refreshToken =
        params.get("refresh_token");


      if (
        !accessToken ||
        !refreshToken
      ) {
        showMessage(
          "Återställningslänken är ogiltig eller har gått ut. Begär en ny återställningslänk.",
          "error"
        );

        saveButton.disabled = true;
        return;
      }


      const {
        error
      } =
        await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });


      if (error) {
        console.error(error);

        showMessage(
          "Kunde inte verifiera återställningslänken. Begär en ny länk och försök igen.",
          "error"
        );

        saveButton.disabled = true;
        return;
      }
    }


    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.className =
          "message";


        const newPassword =
          password.value;

        const repeatedPassword =
          confirmPassword.value;


        if (newPassword.length < 8) {
          showMessage(
            "Lösenordet måste vara minst 8 tecken.",
            "error"
          );

          return;
        }


        if (
          newPassword !== repeatedPassword
        ) {
          showMessage(
            "Lösenorden matchar inte.",
            "error"
          );

          return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
          "SPARAR...";


        const {
          error
        } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });


        saveButton.disabled = false;

        saveButton.textContent =
          "SPARA NYTT LÖSENORD";


        if (error) {
          console.error(error);

          showMessage(
            error.message ||
            "Lösenordet kunde inte uppdateras.",
            "error"
          );

          return;
        }


        showMessage(
          "Lösenordet är uppdaterat. Du kan nu logga in på Elysium Admin.",
          "success"
        );


        password.value = "";
        confirmPassword.value = "";


        setTimeout(
          () => {
            window.location.href =
              "admin.html";
          },
          1800
        );
      }
    );


    prepareRecoverySession();
  </script>

</body>
</html>
