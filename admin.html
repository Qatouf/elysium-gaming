<script>
/* =========================================================
   ELYSIUM ADMIN
   Supabase + personalinloggning + bokningar
========================================================= */

const SUPABASE_URL =
  "https://jbwebwdockhgivltgjdu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cDN31gaVNoAG5YdSw_vscw_rJhiZTz6";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let bookings = [];
let selectedBooking = null;
let currentStaff = null;


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    setCurrentDate();

    const {
      data: { session },
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error

      showLogin();

      return;
    }


    if (session?.user) {

      await verifyStaff(

      );

    } else {

      showLogin();
    }

);


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const loginButton =
        document.getElementById("loginButton");

      const errorBox =
        document.getElementById("loginError");


      errorBox.classList.add(
        "hidden"
      );


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showLoginError(
          "Fyll i e-post och lösenord."
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "LOGGAR IN...";


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      loginButton.disabled = false;

      loginButton.textContent =
        "LOGGA IN";


      if (error) {

        console.error(
          "Login error:",
          error
        );


        showLoginError(
          "Fel e-postadress eller lösenord."
        );

        return;
      }


      if (!data?.user) {

        showLoginError(
          "Inloggningen kunde inte genomföras."
        );

        return;
      }


      await verifyStaff(
        data.user
      );
    }
  );


/* =========================================================
   VERIFY STAFF
========================================================= */

async function verifyStaff(user) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_profiles")
      .select(
        "display_name, role, active"
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Staff verification error:",
      error
    );
  }


  const allowed =
    data &&
    data.active === true &&
    (
      data.role === "admin" ||
      data.role === "staff"
    );


  if (!allowed) {

    await supabaseClient.auth.signOut();


    showLogin();


    showLoginError(
      "Det här kontot har inte behörighet till Elysium Admin."
    );

    return;
  }


  currentStaff = {
    ...data,
    user_id: user.id,
    email: user.email
  };


  document
    .getElementById("adminEmail")
    .textContent =
      user.email || "";


  document
    .getElementById("adminName")
    .textContent =
      data.display_name ||
      "Elysium Personal";


  showAdmin();


  await loadBookings();
}


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(text) {

  const errorBox =
    document.getElementById(
      "loginError"
    );


  errorBox.textContent =
    text;


  errorBox.classList.remove(
    "hidden"
  );
}


/* =========================================================
   SHOW LOGIN / ADMIN
========================================================= */

function showLogin() {

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");


  document
    .getElementById("adminApp")
    .classList.add("hidden");
}


function showAdmin() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("adminApp")
    .classList.remove("hidden");
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient.auth.signOut();


  bookings = [];
  selectedBooking = null;
  currentStaff = null;


  const passwordInput =
    document.getElementById(
      "password"
    );


  if (passwordInput) {

    passwordInput.value = "";
  }


  showLogin();
}


/* =========================================================
   LOAD BOOKINGS
========================================================= */

async function loadBookings() {

  const container =
    document.getElementById(
      "bookingContent"
    );


  container.innerHTML =
    `
    <div class="loading">
      Hämtar bokningar...
    </div>
    `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bookings")
      .select(`
        *,
        booking_resources (
          resource_id,
          active,
          resources (
            code,
            name,
            type
          )
        )
      `)
      .order(
        "booking_date",
        {
          ascending: false
        }
      )
      .order(
        "start_time",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Load bookings error:",
      error
    );


    container.innerHTML =
      `
      <div class="empty">
        Kunde inte hämta bokningarna.
        <br><br>
        ${escapeHTML(
          error.message
        )}
      </div>
      `;

    return;
  }


  bookings =
    Array.isArray(data)
      ? data
      : [];


  updateStats();

  renderBookings();
}


/* =========================================================
   DATE
========================================================= */

function getStockholmDate() {

  const formatter =
    new Intl.DateTimeFormat(
      "sv-SE",
      {
        timeZone:
          "Europe/Stockholm",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"
      }
    );


  const parts =
    formatter.formatToParts(
      new Date()
    );


  const year =
    parts.find(
      item =>
        item.type === "year"
    )?.value;


  const month =
    parts.find(
      item =>
        item.type === "month"
    )?.value;


  const day =
    parts.find(
      item =>
        item.type === "day"
    )?.value;


  return `${year}-${month}-${day}`;
}


/* =========================================================
   DASHBOARD STATS
========================================================= */

function updateStats() {

  const today =
    getStockholmDate();


  const todayActive =
    bookings.filter(
      booking =>
        booking.booking_date === today &&
        booking.status !== "cancelled"
    );


  const todayBookings =
    todayActive.length;


  const todayPeople =
    todayActive.reduce(
      (total, booking) =>
        total +
        Number(
          booking.quantity || 0
        ),
      0
    );


  const todayRevenue =
    todayActive.reduce(
      (total, booking) =>
        total +
        Number(
          booking.total_price_sek || 0
        ),
      0
    );


  const futureBookings =
    bookings.filter(
      booking =>
        booking.booking_date >= today &&
        booking.status !== "cancelled"
    ).length;


  document
    .getElementById("todayBookings")
    .textContent =
      todayBookings;


  document
    .getElementById("todayPeople")
    .textContent =
      todayPeople;


  document
    .getElementById("todayRevenue")
    .textContent =
      formatMoney(
        todayRevenue
      );


  document
    .getElementById("futureBookings")
    .textContent =
      futureBookings;
}


/* =========================================================
   RENDER BOOKINGS
========================================================= */

    document.getElementById(

    );

    document.getElementById(
      "statusFilter"
    );

    document.getElementById(
      "typeFilter"
    );

    searchInput
      ? searchInput.value

          .toLowerCase()
      : "";

    statusFilter
      ? statusFilter.value
      : "all";


  const type =
    typeFilter
      ? typeFilter.value
      : "all";


  const filtered =
    bookings.filter(
      booking => {

        const searchable =
          [
            booking.booking_number,
            booking.customer_name,
            booking.customer_email,
            booking.customer_phone
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchable.includes(
            search
          );


        const matchesStatus =
          status === "all" ||
          booking.status === status;


        const matchesType =
          type === "all" ||
          booking.resource_type === type;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesType
        );
      }
    );


  const container =
    document.getElementById(
      "bookingContent"
    );


  if (!filtered.length) {

      <div class="empty">

            <th>
              Bokningsnummer

            <th>
              Kund
            </th>

            </th>

              Tid
            </th>

            <th>
              Antal
            </th>

            <th>
              Pris
            </th>

            <th>
              Betalning
            </th>

            <th>
              Status
            </th>

            <th></th>

          </tr>

        </thead>

        <tbody>
    `;


  filtered.forEach(
    booking => {

      const quantityText =
        booking.resource_type === "pc"

            )} pers.`

          : `${Number(
              booking.quantity || 0
            )} zon${
              Number(
                booking.quantity || 0
              ) === 1
                ? ""
                : "er"
            }`;


      html +=
        `
        <tr>

          <td>

            <span class="booking-number">
              ${escapeHTML(
                booking.booking_number ||
                "—"
              )}
            </span>

          </td>


          <td>

            <span class="customer-name">
              ${escapeHTML(
                booking.customer_name ||
                "—"
              )}
            </span>


            <span class="customer-email">
              ${escapeHTML(
                booking.customer_phone ||
                booking.customer_email ||
                ""
              )}
            </span>

          </td>


          <td>
            ${escapeHTML(
              activityName(
                booking.resource_type
              )
            )}
          </td>


          <td>
            ${formatDate(
              booking.booking_date
            )}
          </td>


          <td>
            ${formatTime(
              booking.start_time
            )}
          </td>


          <td>
            ${quantityText}
          </td>


          <td>

            <strong>
              ${formatMoney(
                booking.total_price_sek
              )}
            </strong>

          </td>


          <td>
            ${paymentBadge(
              booking.payment_status
            )}
          </td>


          <td>
            ${statusBadge(
              booking.status
            )}
          </td>


          <td>

            <button

            >
              Visa

          </td>

        </tr>
        `;
    }
  );


  html +=
    `
        </tbody>

      </table>

    </div>
    `;


  container.innerHTML =
    html;
}

            ${escapeHTML(

            )}
          </strong>

            E-post
          </span>

          <strong>
            ${escapeHTML(
              booking.customer_email ||

            )}
          </strong>

            Aktivitet
          </span>

            ${escapeHTML(

                booking.resource_type

          </strong>

        </div>


        <div class="detail">

          <span>
            Antal
          </span>

/* =========================================================
   MODAL BUTTONS
========================================================= */

function updateModalButtons() {

  if (!selectedBooking) {

    return;
  }


  const paidButton =
    document.getElementById(
      "paidButton"
    );


  const completeButton =
    document.getElementById(
      "completeButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  const cancelled =
    selectedBooking.status ===
    "cancelled";


  const completed =
    selectedBooking.status ===
    "completed";


  paidButton.textContent =
    selectedBooking.payment_status ===
    "paid"

      ? "Markera som obetald"

      : "Markera som betald";


  cancelButton.disabled =
    cancelled;


  completeButton.disabled =
    cancelled ||
    completed;


  cancelButton.textContent =
    cancelled

      ? "Bokningen är avbokad"

      : "Avboka bokning";


  completeButton.textContent =
    completed

      ? "Bokningen är slutförd"

      : "Markera som slutförd";
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

  document
    .getElementById(
      "bookingModal"
    )
    .classList.add(
      "hidden"
    );


  selectedBooking = null;
}


/* =========================================================
   PAYMENT STATUS
========================================================= */

async function togglePayment() {

  if (!selectedBooking) {

    return;
  }


  const newStatus =
    selectedBooking.payment_status ===
    "paid"

      ? "unpaid"

      : "paid";


  const {
    error
  } =
    await supabaseClient
      .from("bookings")
      .update({
        payment_status:
          newStatus
      })
      .eq(
        "id",
        selectedBooking.id
      );


  if (error) {

    console.error(
      "Payment status error:",
      error
    );


    alert(
      "Kunde inte ändra betalstatus: " +
      error.message
    );

    return;
  }


  closeModal();

  await loadBookings();
}


/* =========================================================
   COMPLETE BOOKING
========================================================= */

async function markCompleted() {

  if (!selectedBooking) {

    return;
  }


  if (
    selectedBooking.status ===
    "cancelled"
  ) {

    return;
  }


  const confirmed =
    confirm(
      "Vill du markera bokningen som slutförd?"
    );


  if (!confirmed) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bookings")
      .update({
        status:
          "completed"
      })
      .eq(
        "id",
        selectedBooking.id
      );


  if (error) {

    console.error(
      "Complete booking error:",
      error
    );


    alert(
      "Kunde inte uppdatera bokningen: " +
      error.message
    );

    return;
  }


  closeModal();

  await loadBookings();
}


/* =========================================================
   CANCEL BOOKING
   använder säker Supabase RPC
========================================================= */

async function cancelBooking() {

  if (!selectedBooking) {

    return;
  }


  if (
    selectedBooking.status ===
    "cancelled"
  ) {

    return;
  }


  const bookingNumber =
    selectedBooking.booking_number ||
    "bokningen";


  const confirmed =
    confirm(
      `Är du säker på att du vill avboka ${bookingNumber}?

De tilldelade PC/PS5-stationerna blir lediga direkt.`
    );


  if (!confirmed) {

    return;
  }


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  cancelButton.disabled = true;

  cancelButton.textContent =
    "AVBOKAR...";


  const {
    error
  } =
    await supabaseClient
      .rpc(
        "cancel_elysium_booking",
        {
          p_booking_id:
            selectedBooking.id
        }
      );


  if (error) {

    console.error(
      "Cancel booking error:",
      error
    );


    cancelButton.disabled = false;

    cancelButton.textContent =
      "Avboka bokning";


    alert(
      "Kunde inte avboka bokningen: " +
      error.message
    );

    return;
  }


  closeModal();

  await loadBookings();


  alert(
    "Bokningen är avbokad och stationerna är nu lediga igen."
  );
}


/* =========================================================
   HELPERS
========================================================= */

function activityName(type) {

  if (type === "pc") {

    return "PC Gaming";
  }


  if (type === "ps5") {

    return "PS5";
  }


  return type || "—";
}


function formatMoney(value) {

  return (
    Number(
      value || 0
    )
    .toLocaleString(
      "sv-SE"
    )
    +
    " kr"
  );
}


function formatTime(value) {

  if (!value) {

    return "—";
  }


  return String(
    value
  ).slice(
    0,
    5
  );
}


function formatDuration(minutes) {

  const value =
    Number(
      minutes || 0
    );


  if (!value) {

    return "—";
  }


  if (
    value % 60 === 0
  ) {

    const hours =
      value / 60;


    return hours === 1
      ? "1 timme"
      : `${hours} timmar`;
  }


  return `${value} min`;
}


function formatDate(value) {

  if (!value) {

    return "—";
  }


  const parts =
    String(value)
      .split("-");


  if (
    parts.length !== 3
  ) {

    return escapeHTML(
      value
    );
  }


  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  return date
    .toLocaleDateString(
      "sv-SE",
      {
        day:
          "numeric",

        month:
          "short",

        year:
          "numeric"
      }
    );
}


/* =========================================================
   PAYMENT DISPLAY
========================================================= */

function paymentText(status) {

  switch (status) {

    case "paid":

      return "Betald";


    case "refunded":

      return "Återbetald";


    default:

      return "Obetald";
  }
}


function paymentBadge(status) {

  if (status === "paid") {

    return `
      <span class="badge badge-paid">
        Betald
      </span>
    `;
  }


  if (status === "refunded") {

    return `
      <span class="badge badge-refunded">
        Återbetald
      </span>
    `;
  }


  return `
    <span class="badge badge-unpaid">
      Obetald
    </span>
  `;
}


/* =========================================================
   STATUS DISPLAY
========================================================= */

function statusText(status) {

  switch (status) {

    case "confirmed":

      return "Bekräftad";


    case "cancelled":

      return "Avbokad";


    case "completed":

      return "Slutförd";


    case "no_show":

      return "No-show";


    case "pending":

      return "Väntande";


    default:

      return status || "—";
  }
}


function statusBadge(status) {

  let className =
    "badge-pending";


  if (
    status === "confirmed"
  ) {

    className =
      "badge-confirmed";
  }


  if (
    status === "cancelled"
  ) {

    className =
      "badge-cancelled";
  }


  if (
    status === "completed"
  ) {

    className =
      "badge-completed";
  }


  return `
    <span class="badge ${className}">
      ${escapeHTML(
        statusText(status)
      )}
    </span>
  `;
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}


/* =========================================================
   HEADER DATE
========================================================= */

function setCurrentDate() {

  const element =
    document.getElementById(
      "currentDate"
    );


  if (!element) {

    return;
  }


  element.textContent =
    new Date()
      .toLocaleDateString(
        "sv-SE",
        {
          timeZone:
            "Europe/Stockholm",

          weekday:
            "long",

          day:
            "numeric",

          month:
            "long",

          year:
            "numeric"
        }
      );
}


/* =========================================================
   NAVIGATION
========================================================= */

function scrollBookings() {

  const section =
    document.getElementById(
      "bookingsSection"
    );


  if (section) {

    section.scrollIntoView({
      behavior:
        "smooth"
    });
  }


  document
    .getElementById(
      "sidebar"
    )
    ?.classList.remove(
      "open"
    );
}


function toggleSidebar() {

  document
    .getElementById(
      "sidebar"
    )
    ?.classList.toggle(
      "open"
    );
}


/* =========================================================
   MODAL BACKGROUND CLICK
========================================================= */

document
  .getElementById(
    "bookingModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();
      }
    }
  );


/* =========================================================
   AUTH CHANGES
========================================================= */

supabaseClient
  .auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        event ===
        "SIGNED_OUT"
      ) {

        showLogin();

        return;
      }


      if (
        event ===
        "SIGNED_IN"
        &&
        session?.user
        &&
        !currentStaff
      ) {

        await verifyStaff(
          session.user
        );
      }
    }
  );

</script>
